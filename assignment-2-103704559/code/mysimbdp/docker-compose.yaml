services:
  broker:
    image: apache/kafka:3.7.2
    container_name: broker
    ports:
      - "9092:9092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:29092 --list || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=mysimbdp
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cqlsh -e 'DESCRIBE KEYSPACES' localhost 2>/dev/null | grep -q system",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - cassandra_data:/var/lib/cassandra

  cqlsh:
    image: cassandra:4.1
    container_name: cqlsh
    depends_on:
      cassandra:
        condition: service_started
    entrypoint: ["bash", "-lc", "sleep infinity"]

  streamingestmanager:
    build:
      context: .
      dockerfile: Dockerfile.platform
    image: mysimbdp-platform:latest
    container_name: streamingestmanager
    depends_on:
      broker:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: "broker:29092"
      CASSANDRA_HOST: "cassandra"
      MONITOR_URL: "http://streamingestmonitor:8002"
      REPORT_WINDOW_SEC: "10"
      MANAGER_NAME: "mysimbdp-streamingestmanager"
    ports:
      - "8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./state:/app/state
      - ./logs:/app/logs
    command: ["python", "streamingestmanager.py"]

  streamingestmonitor:
    image: mysimbdp-platform:latest
    container_name: streamingestmonitor
    depends_on:
      streamingestmanager:
        condition: service_started
      cassandra:
        condition: service_healthy
    environment:
      CASSANDRA_HOST: "cassandra"
      MONITOR_PORT: "8002"
      MANAGER_URL: "http://streamingestmanager:8001"
      MAX_AVG_INGEST_MS: "50"
      MIN_RECORDS_PER_WINDOW: "1"
    ports:
      - "8002:8002"
    command: ["python", "streamingestmonitor.py"]

  batchmanager:
    image: mysimbdp-platform:latest
    container_name: batchmanager
    depends_on:
      streamingestmanager:
        condition: service_started
      cassandra:
        condition: service_healthy
    environment:
      CASSANDRA_HOST: "cassandra"
      TENANT_CONFIGS_DIR: "/app/tenant_configs"
      CACHE_BASE_DIR: "/app/cache"
      BATCH_MANAGER_PORT: "8003"
    ports:
      - "8003:8003"
    volumes:
      - ./cache:/app/cache
      - ./logs:/app/logs
    command: ["python", "batchmanager.py"]

  tenanta-producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: tenanta-producer
    depends_on:
      broker:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: "broker:29092"
      POLL_INTERVAL_SEC: "0.5"
    restart: on-failure

  spark-master:
    image: apache/spark:3.5.5-scala2.12-java17-python3-ubuntu
    container_name: spark-master
    user: root
    entrypoint:
      [
        "/bin/bash",
        "-c",
        "/opt/spark/sbin/start-master.sh && tail -f /opt/spark/logs/*",
      ]
    ports:
      - "8080:8080"
      - "7077:7077"
    depends_on:
      broker:
        condition: service_healthy
      cassandra:
        condition: service_healthy

  spark-worker:
    image: apache/spark:3.5.5-scala2.12-java17-python3-ubuntu
    container_name: spark-worker
    user: root
    entrypoint:
      [
        "/bin/bash",
        "-c",
        "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /opt/spark/logs/*",
      ]
    depends_on:
      spark-master:
        condition: service_started

  spark-streaming:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-streaming
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      broker:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: "broker:29092"
      KAFKA_INPUT_TOPIC: "tenantA.bronze.raw"
      KAFKA_ALERT_TOPIC: "tenantA.alerts"
      CASSANDRA_HOST: "cassandra"
      CASSANDRA_KEYSPACE: "tenanta_analytics"
      CASSANDRA_TABLE: "window_results"
      WINDOW_DURATION: "5 minutes"
      WINDOW_SLIDE: "1 minute"
      WATERMARK_DELAY: "2 minutes"
      TRIGGER_INTERVAL: "30 seconds"
      PM25_ALERT_THRESHOLD: "15.0"
      PM10_ALERT_THRESHOLD: "45.0"
      SPARK_SHUFFLE_PARTITIONS: "4"
    volumes:
      - spark_checkpoint:/tmp/spark-checkpoint
    command: >
      spark-submit
        --master local[2]. 
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,com.datastax.spark:spark-cassandra-connector_2.12:3.5.0
        --conf spark.cassandra.connection.host=cassandra
        --conf spark.cassandra.connection.port=9042
        --conf spark.sql.streaming.checkpointLocation=/tmp/spark-checkpoint/streamanalyticsapp
        /app/streamanalyticsapp.py
    restart: on-failure

  tenant-alert-consumer:
    image: mysimbdp-platform:latest
    container_name: tenant-alert-consumer
    depends_on:
      streamingestmanager:
        condition: service_started
      broker:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: "broker:29092"
      KAFKA_ALERT_TOPIC: "tenantA.alerts"
      CONSUMER_GROUP: "tenantA-alert-service"
      PYTHONUNBUFFERED: "1"
    command: ["python", "alert_consumer.py"]
    restart: on-failure

volumes:
  cassandra_data:
  spark_checkpoint:
